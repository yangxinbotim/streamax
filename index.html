<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申根签证 90/180 天停留计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4f8;--card:#ffffff;--primary:#3b82f6;--primary-light:#eff6ff;
  --stay:#f59e0b;--stay-light:#fef3c7;--stay-faded:#fde68a;
  --danger:#ef4444;--danger-light:#fee2e2;
  --warning:#f59e0b;--warning-light:#fef3c7;
  --success:#10b981;--success-light:#d1fae5;
  --text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --weekend:#f4f6f9;--window-bg:#eff6ff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:18px 24px;-webkit-user-select:none;user-select:none;font-size:14px}
.container{max-width:1000px;margin:0 auto}

/* Header */
header{text-align:center;margin-bottom:14px}
header h1{font-size:19px;font-weight:700;display:inline}
header p{color:var(--muted);font-size:14px;display:inline;margin-left:12px}
.lang-toggle{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--primary);transition:all .15s;margin-left:12px;vertical-align:middle;display:inline-flex;align-items:center;gap:5px}
.lang-toggle:hover{background:var(--primary-light);border-color:var(--primary)}
.lang-icon{flex-shrink:0}

/* Intro */
.intro{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:16px;font-size:13.5px;color:var(--muted);line-height:1.65;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.intro strong{color:var(--text);font-weight:600}
.intro .how{margin-top:6px;color:var(--text)}

/* Legend */
.legend{display:flex;gap:14px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.legend-color{width:14px;height:14px;border-radius:3px;flex-shrink:0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border-radius:12px;padding:16px 18px;border:2px solid var(--border);text-align:center;transition:border-color .2s;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.stat-card .label{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
.stat-card .value{font-size:28px;font-weight:700;line-height:1.1}
.stat-card .unit{font-size:13px;color:var(--muted);font-weight:400}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}
.stat-card.safe{border-color:var(--success)}.stat-card.safe .value{color:var(--success)}
.stat-card.warning{border-color:var(--warning)}.stat-card.warning .value{color:var(--warning)}
.stat-card.danger{border-color:var(--danger)}.stat-card.danger .value{color:var(--danger)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .3s,background .3s}

/* Timeline */
.timeline-section{background:var(--card);border-radius:12px;padding:16px 18px;border:1px solid var(--border);margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.timeline-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.timeline-title{font-size:15px;font-weight:600}
.timeline-hint{font-size:12px;color:var(--muted)}
.timeline-controls{display:flex;gap:6px;align-items:center}
.toggle-btn{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s}
.toggle-btn.active{background:var(--primary);color:white;border-color:var(--primary)}
.toggle-btn:hover{opacity:.85}
.ref-info{background:var(--primary-light);border-radius:8px;padding:9px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px;flex-wrap:wrap;gap:6px;line-height:1.4}
.ref-info .ref-date{font-weight:600;color:var(--primary)}
.ref-info button{background:var(--primary);color:white;border:none;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12px;white-space:nowrap}
.ref-info button:hover{opacity:.9}
.timeline-wrapper{overflow-x:auto;padding-bottom:4px;cursor:crosshair}
.timeline{display:flex;align-items:flex-end;gap:1px;height:100px;min-width:min-content;position:relative;padding-top:8px}
.timeline-bar{flex:1;min-width:3px;max-width:7px;border-radius:2px 2px 0 0;cursor:pointer;position:relative;z-index:1;transition:opacity .15s}
.timeline-bar:hover{filter:brightness(1.2)}
.timeline-bar.today-marker{box-shadow:0 -4px 0 0 var(--primary),0 0 0 1px var(--primary)}
.timeline-bar.ref-marker{box-shadow:0 -5px 0 0 #8b5cf6,0 0 0 1px #8b5cf6}
.timeline-bar.in-window-bg{opacity:1}
.timeline-bar.out-window-bg{opacity:.3}
.timeline-future-bg{position:absolute;top:0;bottom:0;background:rgba(100,116,139,.07);pointer-events:none;z-index:0}
.timeline-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--primary);opacity:.55;transform:translateX(-1px);pointer-events:none;z-index:3}
.timeline-today-label{position:absolute;top:0;transform:translate(-50%,2px);font-size:10px;color:var(--primary);font-weight:700;pointer-events:none;white-space:nowrap;z-index:4}
.timeline-month-labels{position:relative;padding-top:4px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);height:20px}

/* Calendar */
.calendar-section{background:var(--card);border-radius:12px;padding:16px 18px;border:1px solid var(--border);margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.calendar-nav{display:flex;gap:6px;align-items:center}
.calendar-nav button,.calendar-section .quick-jump{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--text);transition:all .15s;white-space:nowrap}
.calendar-nav button:hover,.calendar-section .quick-jump:hover{background:var(--primary-light);border-color:var(--primary)}
.calendar-nav .month-label{font-size:16px;font-weight:600;min-width:110px;text-align:center}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-label{text-align:center;font-size:13px;color:var(--muted);padding:6px 0;font-weight:500}
.day-label.weekend-label{color:var(--danger)}
.day-cell{aspect-ratio:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:14px;position:relative;transition:background .1s,box-shadow .1s;border:2px solid transparent}
.day-cell:hover{background:var(--primary-light)}
.day-cell.empty{cursor:default}.day-cell.empty:hover{background:transparent}
.day-cell.weekend{background:var(--weekend)}
.day-cell.weekend:hover{background:var(--primary-light)}
.day-cell.in-window:not(.stay){background:var(--window-bg)}
.day-cell.in-window:not(.stay):hover{background:#dbeafe}
.day-cell.stay{background:var(--stay);color:white;font-weight:600}
.day-cell.stay:hover{background:#d97706}
.day-cell.stay.out-window{background:var(--stay-faded);color:#92400e}
.day-cell.stay.out-window:hover{background:#fbbf24;color:white}
.day-cell.today{border-color:var(--primary);font-weight:700}
.day-cell.reference{box-shadow:0 0 0 3px #8b5cf6}
.day-cell.dragging{outline:3px solid var(--primary);outline-offset:-3px;z-index:1}
.day-cell .count-badge{position:absolute;top:3px;right:3px;font-size:10px;color:var(--danger);font-weight:700}

/* Controls */
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.controls button{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 18px;cursor:pointer;font-size:14px;color:var(--text);transition:all .15s}
.controls button:hover{background:var(--primary-light);border-color:var(--primary)}
.controls button.danger:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}

/* Tooltip */
.tooltip{position:fixed;background:var(--text);color:white;padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;z-index:1000;white-space:nowrap;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);line-height:1.4}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:8px 24px;border-radius:8px;font-size:14px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 data-i18n="title">🌍 申根签证停留天数追踪器</h1>
    <p data-i18n="subtitle">90/180天规则</p>
    <button id="langToggle" class="lang-toggle" onclick="toggleLang()" aria-label="切换语言 Switch language" title="切换语言 / Switch language">
      <svg class="lang-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg><span id="langText">EN</span>
    </button>
  </header>

  <div class="intro" data-i18n="intro"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:var(--stay)"></div><span data-i18n="legend_stay">停留日</span></div>
    <div class="legend-item"><div class="legend-color" style="background:var(--window-bg);border:1px solid var(--primary)"></div><span data-i18n="legend_window">180天窗口</span></div>
    <div class="legend-item"><div class="legend-color" style="background:var(--stay-faded)"></div><span data-i18n="legend_out">窗口外停留</span></div>

    <div class="legend-item"><div class="legend-color" style="background:var(--warning)"></div><span data-i18n="legend_8090">80-90天</span></div>
    <div class="legend-item"><div class="legend-color" style="background:var(--danger)"></div><span data-i18n="legend_gt90">&gt;90天</span></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="timeline-section">
    <div class="timeline-header">
      <div>
        <div class="timeline-title"><span data-i18n="timeline_title">📊 365天概览</span> <span class="timeline-hint" data-i18n="timeline_hint">· 点击柱状条切换参考日期</span></div>
      </div>
      <div class="timeline-controls">
        <button class="toggle-btn" id="projectionToggle" onclick="toggleProjection()">连续停留预测</button>
      </div>
    </div>
    <div class="ref-info" id="refInfo"></div>
    <div class="timeline-wrapper">
      <div class="timeline" id="timeline"></div>
      <div class="timeline-month-labels" id="timelineLabels"></div>
    </div>
  </div>

  <div class="calendar-section">
    <div class="calendar-header">
      <div class="calendar-nav">
        <button onclick="changeMonth(-1)" data-i18n="nav_prev">‹ 上月</button>
        <span class="month-label" id="monthLabel"></span>
        <button onclick="changeMonth(1)" data-i18n="nav_next">下月 ›</button>
      </div>
      <div class="calendar-nav">
        <button onclick="goToToday()" data-i18n="nav_today">📌今天</button>
        <button class="quick-jump" onclick="jumpToRef()" data-i18n="nav_ref">📌参考日</button>
      </div>
    </div>
    <div class="calendar-grid" id="dayLabels"></div>
    <div class="calendar-grid" id="calendar" style="margin-top:4px"></div>
  </div>

  <div class="controls">
    <button onclick="exportData()" data-i18n="btn_export">📥导出数据</button>
    <button onclick="document.getElementById('importFile').click()" data-i18n="btn_import">📤导入数据</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button onclick="loadDemo()" data-i18n="btn_demo">📋加载示例</button>
    <button class="danger" onclick="clearAll()" data-i18n="btn_clear">🗑️清除全部</button>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
// ===== i18n =====
const I18N = {
  zh:{
    title:'🌍 申根签证停留天数追踪器', subtitle:'90/180天规则',
    intro:'<strong>规则：</strong>申根签证规定，在任意连续 <strong>180 天</strong> 内，最多可停留 <strong>90 天</strong>。本工具自动按 180 天滚动窗口统计您已停留的天数，并提示剩余额度。'+
          '<div class="how"><strong>操作：</strong>在日历上单击标记/取消某天为“在欧洲停留”，或按住拖拽选择连续日期范围；点击下方概览柱状条可切换参考日期，窗口随之移动。数据自动保存在本浏览器。</div>',
    legend_stay:'停留日', legend_window:'180天窗口', legend_out:'窗口外停留', legend_le79:'≤79天', legend_8090:'80-90天', legend_gt90:'>90天',
    stat_past:'过去180天已停留', stat_remain:'剩余可停留', stat_ref:'参考日期', stat_leave:'连续停留最晚离开', stat_over:'超限天数',
    sub_continue:'可继续停留', sub_limit:'已达上限/超限', sub_nottoday:'非今天 · 可切换', sub_leave:'请尽快离开', sub_fromtoday:'从今天起每天停留', sub_max:'最多90天', sub_nolimit:'无限制',
    timeline_title:'📊 365天概览', timeline_hint:'· 点击柱状条切换参考日期',
    projection:'连续停留预测', projection_on:'✓预测已开',
    ref_window:'窗口', ref_stayed:'停留', ref_remaining:'剩余', ref_back:'⏪今天',
    nav_prev:'‹ 上月', nav_next:'下月 ›', nav_today:'📌今天', nav_ref:'📌参考日',
    btn_export:'📥导出数据', btn_import:'📤导入数据', btn_demo:'📋加载示例', btn_clear:'🗑️清除全部',
    today_line:'今天',
    tt_window:'窗口停留', tt_over:'⚠️超限', tt_near:'⚠️接近上限', tt_stay:'✓停留', tt_win:'窗口',
    unit_days:'/{n}天', day:'天',
    toast_export:'数据已导出', toast_import:'已导入{v}天记录', toast_cleared:'已清除', toast_nodata:'无数据', toast_importfail:'导入失败', toast_demo:'已加载示例({v}天)', toast_mark:'标记{v}天', toast_unmark:'取消{v}天',
    lang_toggle:'EN',
    confirm_clear:'确定清除全部{v}天记录？', confirm_demo:'加载示例将覆盖现有数据，确定？',
    months:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
    days:['一','二','三','四','五','六','日']
  },
  en:{
    title:'🌍 Schengen Stay Tracker', subtitle:'90/180-day rule',
    intro:'<strong>Rule:</strong> The Schengen visa allows a maximum stay of <strong>90 days</strong> within any continuous <strong>180-day</strong> period. This tool automatically counts your stays in a rolling 180-day window and shows your remaining allowance.'+
          '<div class="how"><strong>How to use:</strong> Click a calendar day to mark/unmark it as a day spent in Europe, or press and drag to select a continuous range. Click a bar in the overview below to change the reference date — the window moves with it. Data is saved automatically in this browser.</div>',
    legend_stay:'Stay day', legend_window:'180-day window', legend_out:'Out-of-window stay', legend_le79:'≤79 days', legend_8090:'80-90 days', legend_gt90:'>90 days',
    stat_past:'Stayed (past 180d)', stat_remain:'Remaining', stat_ref:'Reference date', stat_leave:'Latest departure', stat_over:'Days over limit',
    sub_continue:'can stay more', sub_limit:'limit reached / over', sub_nottoday:'not today · switchable', sub_leave:'leave ASAP', sub_fromtoday:'stay daily from today', sub_max:'up to 90 days', sub_nolimit:'no limit',
    timeline_title:'📊 365-day overview', timeline_hint:'· click a bar to change reference date',
    projection:'Stay projection', projection_on:'✓ projection on',
    ref_window:'window', ref_stayed:'stayed', ref_remaining:'remaining', ref_back:'⏪Today',
    nav_prev:'‹ Prev', nav_next:'Next ›', nav_today:'📌Today', nav_ref:'📌Ref',
    btn_export:'📥 Export', btn_import:'📤 Import', btn_demo:'📋 Demo', btn_clear:'🗑️ Clear',
    today_line:'Today',
    tt_window:'window stay', tt_over:'⚠️ over limit', tt_near:'⚠️ near limit', tt_stay:'✓ stay', tt_win:'window',
    unit_days:'/{n} days', day:'days',
    toast_export:'Data exported', toast_import:'Imported {v} days', toast_cleared:'Cleared', toast_nodata:'No data', toast_importfail:'Import failed', toast_demo:'Demo loaded ({v} days)', toast_mark:'Marked {v} days', toast_unmark:'Unmarked {v} days',
    lang_toggle:'中文',
    confirm_clear:'Clear all {v} days of records?', confirm_demo:'Loading the demo will overwrite existing data. Continue?',
    months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
  }
};
let lang = (function(){try{return localStorage.getItem('schengen_lang')||'zh'}catch(e){return 'zh'}})();
function t(key,vars){
  let s = (I18N[lang]&&I18N[lang][key]!=null) ? I18N[lang][key] : (I18N.zh[key]!=null?I18N.zh[key]:key);
  if(vars){for(const k in vars)s=String(s).replace('{'+k+'}',vars[k]);}
  return s;
}

// ===== Constants =====
const MAX_DAYS = 90;
const WINDOW_DAYS = 180;
const STORAGE_KEY = 'schengen_stay_dates';
const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const dayNames = ['一','二','三','四','五','六','日'];

// ===== State =====
let today = new Date();
today.setHours(0,0,0,0);

let stayDates = new Set();
let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
let referenceDate = new Date(today);
let isDragging = false;
let dragStart = null;
let dragEnd = null;
let dragMode = null;
let showProjection = false;

// ===== Date Utils =====
function fmt(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function isSameDay(a,b){return fmt(a)===fmt(b)}
function getWindowStart(endDate){return addDays(endDate,-(WINDOW_DAYS-1))}

// ===== Calculations =====
function getStayCountInWindow(endDate){
  const start=getWindowStart(endDate);
  const startStr=fmt(start),endStr=fmt(endDate);
  let count=0;
  for(const s of stayDates){if(s>=startStr&&s<=endStr)count++}
  return count;
}

function getRemainingDays(refDate){return MAX_DAYS-getStayCountInWindow(refDate)}

function getStatus(count){
  if(count>MAX_DAYS)return'danger';
  if(count>=80)return'warning';
  return'safe';
}

function getColorForCount(count){
  if(count>MAX_DAYS)return'var(--danger)';
  if(count>=80)return'var(--warning)';
  return'var(--success)';
}

function getProjectedCount(d){
  const start=getWindowStart(d);
  const startStr=fmt(start),endStr=fmt(d);
  let count=0;
  for(const s of stayDates){if(s>=startStr&&s<=endStr)count++}
  if(d>=today){
    let day=new Date(today);
    while(day<=d){
      if(!stayDates.has(fmt(day)))count++;
      day=addDays(day,1);
    }
  }
  return count;
}

function getMustLeaveDate(){
  let d=new Date(today);
  for(let i=0;i<400;i++){
    if(getProjectedCount(d)>MAX_DAYS)return addDays(d,-1);
    d=addDays(d,1);
  }
  return null;
}

// ===== Rendering: Stats =====
function renderStats(){
  const count=getStayCountInWindow(referenceDate);
  const remaining=getRemainingDays(referenceDate);
  const status=getStatus(count);
  const wStart=getWindowStart(referenceDate);

  let card4Html,card4Class;
  if(count>MAX_DAYS){
    card4Html=`<div class="value">${count-MAX_DAYS}<span class="unit">${t('stat_over')}</span></div>`;
    card4Class='danger';
  }else{
    const leaveDate=getMustLeaveDate();
    if(leaveDate&&leaveDate>=today){
      card4Html=`<div class="value" style="font-size:20px">${leaveDate.getMonth()+1}月${leaveDate.getDate()}日</div>`;
      card4Class=getStatus(count);
    }else if(count===0){
      card4Html=`<div class="value" style="font-size:20px">${t('sub_max')}</div>`;
      card4Class='safe';
    }else{
      card4Html=`<div class="value" style="font-size:20px">${t('sub_nolimit')}</div>`;
      card4Class='safe';
    }
  }

  const pct=Math.min(count/MAX_DAYS*100,100);
  const fillBg=getColorForCount(count);

  document.getElementById('stats').innerHTML=`
    <div class="stat-card ${status}">
      <div class="label">${t('stat_past')}</div>
      <div class="value">${count}<span class="unit">${t('unit_days',{n:MAX_DAYS})}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${fillBg}"></div></div>
      <div class="sub">${fmt(wStart)} ~ ${fmt(referenceDate)}</div>
    </div>
    <div class="stat-card ${status}">
      <div class="label">${t('stat_remain')}</div>
      <div class="value">${remaining}<span class="unit"> ${t('day')}</span></div>
      <div class="sub">${remaining>0?t('sub_continue'):t('sub_limit')}</div>
    </div>
    <div class="stat-card">
      <div class="label">${t('stat_ref')}</div>
      <div class="value" style="font-size:20px">${fmt(referenceDate)}</div>
      <div class="sub">${isSameDay(referenceDate,today)?t('today_line'):t('sub_nottoday')}</div>
    </div>
    <div class="stat-card ${card4Class}">
      <div class="label">${count>MAX_DAYS?t('stat_over'):t('stat_leave')}</div>
      ${card4Html}
      <div class="sub">${count>MAX_DAYS?t('sub_leave'):t('sub_fromtoday')}</div>
    </div>
  `;
}

// ===== Rendering: Ref Info =====
function renderRefInfo(){
  const count=getStayCountInWindow(referenceDate);
  const remaining=getRemainingDays(referenceDate);
  const wStart=getWindowStart(referenceDate);
  const isToday=isSameDay(referenceDate,today);
  document.getElementById('refInfo').innerHTML=`
    <span>📐 <span class="ref-date">${fmt(referenceDate)}</span>${isToday?'('+t('today_line')+')':''}
      · ${t('ref_window')} ${fmt(wStart)} → ${fmt(referenceDate)}
      · ${t('ref_stayed')} <strong style="color:${getColorForCount(count)}">${count}</strong>/${MAX_DAYS}
      · ${t('ref_remaining')} <strong style="color:${getColorForCount(count)}">${remaining}</strong>${t('day')}
    </span>
    ${!isToday?'<button onclick="resetRefToToday()">'+t('ref_back')+'</button>':''}
  `;
}

// ===== Rendering: Timeline =====
function renderTimeline(){
  const tl=document.getElementById('timeline');
  const tlLabels=document.getElementById('timelineLabels');
  tl.innerHTML='';
  tlLabels.innerHTML='';

  const days=365;
  const startDay=addDays(today,-179);
  const refStr=fmt(referenceDate);
  const todayStr=fmt(today);
  const wStartStr=fmt(getWindowStart(referenceDate));

  let lastMonth=-1;
  const labelPositions=[];

  for(let i=0;i<days;i++){
    const d=addDays(startDay,i);
    const dStr=fmt(d);
    const isFuture=d>today;

    let count;
    if(showProjection&&isFuture){
      count=getProjectedCount(d);
    }else{
      count=getStayCountInWindow(d);
    }

    const pct=Math.min(count/MAX_DAYS*100,100);
    const color=getColorForCount(count);

    const bar=document.createElement('div');
    bar.className='timeline-bar';
    bar.style.height=Math.max(pct,3)+'%';
    bar.style.background=color;
    bar.dataset.date=dStr;
    bar.dataset.count=count;

    if(dStr>=wStartStr&&dStr<=refStr)bar.classList.add('in-window-bg');
    else bar.classList.add('out-window-bg');

    if(dStr===todayStr)bar.classList.add('today-marker');
    if(dStr===refStr)bar.classList.add('ref-marker');

    const m=d.getMonth();
    if(m!==lastMonth){lastMonth=m;labelPositions.push({index:i,label:I18N[lang].months[m]})}

    bar.addEventListener('mouseenter',function(e){
      const c=this.dataset.count;
      const dt=this.dataset.date;
      let msg=`${dt} · ${t('tt_window')}: ${c}/${MAX_DAYS}`;
      if(c>MAX_DAYS)msg+=t('tt_over');else if(c>=80)msg+=t('tt_near');
      showTooltip(e,msg);
    });
    bar.addEventListener('mousemove',moveTooltip);
    bar.addEventListener('mouseleave',hideTooltip);

    bar.addEventListener('click',function(){
      referenceDate=parse(this.dataset.date);
      renderAll();
    });

    tl.appendChild(bar);
  }

  const bars=[...tl.querySelectorAll('.timeline-bar')];
  const tlWidth=tl.scrollWidth;
  tlLabels.style.width=tlWidth+'px';
  let labelHtml='';
  for(const lp of labelPositions){
    const bar=bars[lp.index];
    const left=bar?bar.offsetLeft:Math.round(lp.index/days*tlWidth);
    const clamped=Math.max(left,0);
    labelHtml+=`<span style="position:absolute;left:${clamped}px;transform:translateX(-50%)">${lp.label}</span>`;
  }
  tlLabels.innerHTML=labelHtml;

  // Today divider line + future shading + label
  const todayBar=tl.querySelector('.today-marker');
  if(todayBar){
    const cx=todayBar.offsetLeft+todayBar.offsetWidth/2;
    const fbg=document.createElement('div');
    fbg.className='timeline-future-bg';
    fbg.style.left=cx+'px';
    fbg.style.right='0';
    tl.appendChild(fbg);
    const line=document.createElement('div');
    line.className='timeline-today-line';
    line.style.left=cx+'px';
    tl.appendChild(line);
    const lbl=document.createElement('div');
    lbl.className='timeline-today-label';
    lbl.style.left=cx+'px';
    lbl.textContent=t('today_line');
    tl.appendChild(lbl);
  }

  // Auto-scroll so the reference date is centered/visible
  requestAnimationFrame(function(){
    const wrapper=document.querySelector('.timeline-wrapper');
    const refBar=[...tl.querySelectorAll('.timeline-bar')].find(b=>b.dataset.date===fmt(referenceDate));
    if(refBar&&wrapper){
      wrapper.scrollLeft=refBar.offsetLeft - wrapper.clientWidth/2 + refBar.offsetWidth/2;
    }
  });
}

// ===== Rendering: Calendar =====
function renderDayLabels(){
  const dl=document.getElementById('dayLabels');
  dl.innerHTML=I18N[lang].days.map((n,i)=>`<div class="day-label ${i>=5?'weekend-label':''}">${n}</div>`).join('');
}

function renderCalendar(){
  const year=currentMonth.getFullYear();
  const month=currentMonth.getMonth();
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startWeekday=(firstDay.getDay()+6)%7;
  const daysInMonth=lastDay.getDate();

  const grid=document.getElementById('calendar');
  grid.innerHTML='';

  for(let i=0;i<startWeekday;i++){
    const c=document.createElement('div');
    c.className='day-cell empty';
    grid.appendChild(c);
  }

  const wStart=getWindowStart(referenceDate);
  const wStartStr=fmt(wStart);
  const refStr=fmt(referenceDate);
  const todayStr=fmt(today);

  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(year,month,d);
    const dStr=fmt(date);
    const cell=document.createElement('div');
    cell.className='day-cell';
    cell.dataset.date=dStr;
    cell.textContent=d;

    const weekday=date.getDay();
    if(weekday===0||weekday===6)cell.classList.add('weekend');
    if(dStr>=wStartStr&&dStr<=refStr)cell.classList.add('in-window');
    if(stayDates.has(dStr)){
      cell.classList.add('stay');
      if(!(dStr>=wStartStr&&dStr<=refStr))cell.classList.add('out-window');
    }
    if(dStr===todayStr)cell.classList.add('today');
    if(dStr===refStr)cell.classList.add('reference');

    const count=getStayCountInWindow(date);
    cell.addEventListener('mouseenter',function(e){
      let html=dStr;
      if(stayDates.has(dStr))html+=' · <span style="color:#fbbf24">'+t('tt_stay')+'</span>';
      html+=` · ${t('tt_win')}:${count}/${MAX_DAYS}`;
      if(count>MAX_DAYS)html+=' ⚠️';
      showTooltip(e,html);
    });
    cell.addEventListener('mousemove',moveTooltip);
    cell.addEventListener('mouseleave',hideTooltip);

    grid.appendChild(cell);
  }

  const monthLabelText = lang==='zh' ? `${year}年${I18N[lang].months[month]}` : `${I18N[lang].months[month]} ${year}`;
  document.getElementById('monthLabel').textContent=monthLabelText;
}

// ===== Drag Selection =====
function initDrag(){
  const grid=document.getElementById('calendar');

  grid.addEventListener('mousedown',function(e){
    const cell=e.target.closest('.day-cell');
    if(!cell||!cell.dataset.date)return;
    e.preventDefault();
    isDragging=true;
    dragStart=cell.dataset.date;
    dragEnd=cell.dataset.date;
    dragMode=stayDates.has(dragStart)?'remove':'add';
    updateDragPreview();
  });

  document.addEventListener('mousemove',function(e){
    if(!isDragging)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const cell=el&&el.closest&&el.closest('.day-cell');
    if(cell&&cell.dataset.date){dragEnd=cell.dataset.date;updateDragPreview()}
  });

  document.addEventListener('mouseup',function(){
    if(!isDragging)return;
    applyDrag();
    isDragging=false;
    dragStart=null;dragEnd=null;
    document.querySelectorAll('.day-cell.dragging').forEach(c=>c.classList.remove('dragging'));
  });

  grid.addEventListener('touchstart',function(e){
    const touch=e.touches[0];
    const el=document.elementFromPoint(touch.clientX,touch.clientY);
    const cell=el&&el.closest&&el.closest('.day-cell');
    if(!cell||!cell.dataset.date)return;
    e.preventDefault();
    isDragging=true;dragStart=cell.dataset.date;dragEnd=cell.dataset.date;
    dragMode=stayDates.has(dragStart)?'remove':'add';
    updateDragPreview();
  },{passive:false});

  grid.addEventListener('touchmove',function(e){
    if(!isDragging)return;
    e.preventDefault();
    const touch=e.touches[0];
    const el=document.elementFromPoint(touch.clientX,touch.clientY);
    const cell=el&&el.closest&&el.closest('.day-cell');
    if(cell&&cell.dataset.date){dragEnd=cell.dataset.date;updateDragPreview()}
  },{passive:false});

  grid.addEventListener('touchend',function(){
    if(!isDragging)return;
    applyDrag();isDragging=false;dragStart=null;dragEnd=null;
    document.querySelectorAll('.day-cell.dragging').forEach(c=>c.classList.remove('dragging'));
  });
}

function updateDragPreview(){
  if(!dragStart||!dragEnd)return;
  const minStr=dragStart<dragEnd?dragStart:dragEnd;
  const maxStr=dragStart<dragEnd?dragEnd:dragStart;
  document.querySelectorAll('.day-cell').forEach(cell=>{
    cell.classList.remove('dragging');
    if(cell.dataset.date&&cell.dataset.date>=minStr&&cell.dataset.date<=maxStr)cell.classList.add('dragging');
  });
}

function applyDrag(){
  if(!dragStart||!dragEnd)return;
  const start=parse(dragStart<dragEnd?dragStart:dragEnd);
  const end=parse(dragStart<dragEnd?dragEnd:dragStart);
  let d=new Date(start),changed=0;
  while(d<=end){
    const s=fmt(d);
    if(dragMode==='add')stayDates.add(s);else stayDates.delete(s);
    changed++;d=addDays(d,1);
  }
  saveData();renderAll();
  showToast(t(dragMode==='add'?'toast_mark':'toast_unmark',{v:changed}));
}

// ===== Navigation =====
function changeMonth(delta){currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+delta,1);renderCalendar()}
function goToToday(){currentMonth=new Date(today.getFullYear(),today.getMonth(),1);renderCalendar()}
function jumpToRef(){currentMonth=new Date(referenceDate.getFullYear(),referenceDate.getMonth(),1);renderCalendar()}
function resetRefToToday(){referenceDate=new Date(today);renderAll()}
function toggleProjection(){
  showProjection=!showProjection;
  applyProjectionLabel();
  renderTimeline();
}
function applyProjectionLabel(){
  const pt=document.getElementById('projectionToggle');
  pt.textContent=showProjection?t('projection_on'):t('projection');
  pt.classList.toggle('active',showProjection);
}

// ===== Language =====
function toggleLang(){
  lang = lang==='zh'?'en':'zh';
  try{localStorage.setItem('schengen_lang',lang)}catch(e){}
  applyLang();
}
function applyLang(){
  document.documentElement.lang = lang==='zh'?'zh-CN':'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.innerHTML = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langText').textContent = t('lang_toggle');
  applyProjectionLabel();
  renderAll();
}

// ===== Tooltip =====
function showTooltip(e,html){const tEl=document.getElementById('tooltip');tEl.innerHTML=html;tEl.style.display='block';moveTooltip(e)}
function moveTooltip(e){
  const tEl=document.getElementById('tooltip');
  let x=e.clientX+12,y=e.clientY+12;
  if(x+tEl.offsetWidth>window.innerWidth)x=e.clientX-tEl.offsetWidth-12;
  tEl.style.left=x+'px';tEl.style.top=y+'px';
}
function hideTooltip(){document.getElementById('tooltip').style.display='none'}

// ===== Toast =====
function showToast(msg){
  const tEl=document.getElementById('toast');tEl.textContent=msg;tEl.classList.add('show');
  clearTimeout(tEl._timer);tEl._timer=setTimeout(()=>tEl.classList.remove('show'),1800);
}

// ===== Persistence =====
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...stayDates]))}catch(e){}}
function loadData(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)stayDates=new Set(JSON.parse(s))}catch(e){}}

function exportData(){
  const data={stayDates:[...stayDates].sort(),exportDate:new Date().toISOString(),version:1};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`schengen_stays_${fmt(today)}.json`;a.click();
  URL.revokeObjectURL(url);showToast(t('toast_export'));
}

function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.stayDates&&Array.isArray(data.stayDates)){
        stayDates=new Set(data.stayDates);saveData();renderAll();
        showToast(t('toast_import',{v:stayDates.size}));
      }
    }catch(err){showToast(t('toast_importfail'))}
  };
  reader.readAsText(file);event.target.value='';
}

function clearAll(){
  if(stayDates.size===0){showToast(t('toast_nodata'));return}
  if(confirm(t('confirm_clear',{v:stayDates.size}))){
    stayDates=new Set();saveData();renderAll();showToast(t('toast_cleared'));
  }
}

function loadDemo(){
  if(stayDates.size>0&&!confirm(t('confirm_demo')))return;
  stayDates=new Set();
  const trips=[[addDays(today,-160),addDays(today,-145)],  [addDays(today,-100),addDays(today,-88)],  [addDays(today,-50),addDays(today,-40)],  [addDays(today,-20),addDays(today,-10)]];
  for(const[start,end]of trips){let d=new Date(start);while(d<=end){stayDates.add(fmt(d));d=addDays(d,1)}}
  saveData();renderAll();showToast(t('toast_demo',{v:stayDates.size}));
}

// ===== Main Render =====
function renderAll(){renderStats();renderRefInfo();renderTimeline();renderCalendar()}

// ===== Init =====
function init(){loadData();renderDayLabels();applyLang();initDrag()}
init();
</script>
